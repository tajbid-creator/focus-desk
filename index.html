.wrap{width:100%;padding:18px clamp(16px,3vw,40px) 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--onacc);display:grid;place-items:center;font-weight:700;font-size:20px}
.who input{font:inherit;font-weight:700;font-size:21px;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);width:190px;padding:2px 0}
.who small{display:block;color:var(--mute);font-size:13px}
.hr{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.exam{color:var(--mute);font-size:15px}.exam b{color:var(--gold);font-size:22px;margin:0 3px}
.dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-left:6px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.quote{margin:26px 0 22px;padding:18px 22px;border-left:4px solid var(--gold);background:linear-gradient(90deg,var(--soft),transparent);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.qt{flex:1 1 360px}
.rt{text-align:right;margin-left:auto}
.rc{font-size:clamp(28px,4vw,46px);font-weight:700;color:var(--gold);line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.rd{color:var(--mute);font-size:15px;margin-top:4px}
@media(max-width:600px){.rt{text-align:left;margin-left:0}}
.quote p{margin:0;font-family:"Hind Siliguri","Inter",system-ui,sans-serif;font-size:clamp(19px,2.3vw,27px);font-weight:600;line-height:1.7;transition:opacity .5s}
.quote p.fade{opacity:0}
.ayf{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.ayr{font-family:"Hind Siliguri","Inter",system-ui,sans-serif;color:var(--mute);font-size:15px}
.ayf .chip{padding:4px 12px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:transparent;border:1px solid var(--line);border-radius:20px;padding:24px}
#swcard{margin-top:20px;text-align:center}
#swcard .swh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
#swcard h2{margin:0}
#swcard small{color:var(--mute);font-size:13px}
#swclock{font-size:clamp(40px,9vw,64px);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--ink);margin:6px 0 2px}
#swcard.run #swclock{color:var(--gold2)}
.card h2{margin:0 0 14px;font-size:16px;font-weight:600;color:var(--mute)}
.stage{position:relative;width:min(100%,380px);aspect-ratio:1;margin:6px auto 10px}
.stage svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--track);stroke-width:10}
.arc{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s linear,stroke .3s}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.clock{font-size:clamp(60px,10vw,92px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.state{color:var(--mute);margin-top:6px;font-size:15px}
.running .clock{text-shadow:0 0 28px var(--glow);animation:breathe 2s ease-in-out infinite}
.final .clock{color:var(--red);text-shadow:0 0 34px rgba(255,107,94,.6);animation:beat 1s ease-in-out infinite}
.final .arc{stroke:var(--red)}
@keyframes breathe{50%{text-shadow:0 0 48px var(--gold);transform:scale(1.02)}}
@keyframes beat{0%{transform:scale(1)}15%{transform:scale(1.14)}40%,100%{transform:scale(1)}}
.presets,.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.presets button,.ctl button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 16px;cursor:pointer}
.cust{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 10px}
.cust.on{border-color:var(--ink)}
.cust input{font:inherit;color:var(--ink);background:transparent;border:0;width:64px;padding:6px 2px;-moz-appearance:textfield}
.cust input::-webkit-outer-spin-button,.cust input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cust span{color:var(--mute);font-size:14px}
.presets .cust button{padding:6px 12px;border-radius:9px}
.presets .cust.on button{background:var(--ink);color:var(--onink);border-color:var(--ink);font-weight:600}
.presets button.on{background:var(--ink);color:var(--onink);border-color:var(--ink);font-weight:600}
.ctl .go{background:var(--gold);color:var(--onacc);border-color:var(--gold);font-weight:700;font-size:18px;padding:11px 44px}
.msg{text-align:center;margin-top:12px;min-height:1.4em;color:var(--gold);font-weight:500}
.big{position:relative;width:min(100%,420px);aspect-ratio:1;margin:0 auto}
.big svg{width:100%;height:100%;transform:rotate(-90deg)}
.big .arc{stroke-width:18;transition:stroke-dashoffset .6s}
.big .track{stroke-width:18}
.pct{font-size:clamp(64px,11vw,104px);font-weight:700;line-height:1;color:var(--ink)}
.pct small{font-size:.42em;color:var(--gold)}
.cap{color:var(--mute);margin-top:8px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:13px;color:var(--mute)}
.week{display:flex;align-items:flex-end;gap:10px;height:175px;margin-top:6px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.week i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--gold);min-height:4px}
.week .ok i{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.week .st{display:block;margin:0 auto 4px;filter:drop-shadow(0 0 6px rgba(242,184,75,.85));animation:fly 2.8s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(0) scale(1) rotate(-6deg)}50%{transform:translateY(-7px) scale(1.18) rotate(6deg)}}
.week em{display:block;font-style:normal;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px}
.week .ok em{color:var(--gold)}
.week.dense{gap:3px}
.week.dense em{display:none}
.week.dense div{font-size:10px}
.week.dense .st{width:16px;height:16px;margin-bottom:2px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.row2 h2{margin:0}
.tog button,.bk button,.bk .fb{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 16px;cursor:pointer;display:inline-block}
.tog button{margin-left:6px}
.tog button.on{background:var(--ink);color:var(--onink);font-weight:600}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
@media(max-width:600px){.sum{grid-template-columns:1fr 1fr}}
.bk{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.bk .go2{background:var(--gold);color:var(--onacc);border-color:var(--gold);font-weight:700}
.bkm{color:var(--gold);font-size:14px}
.set{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:600px){.set{grid-template-columns:1fr 1fr}}
label{font-size:13px;color:var(--mute)}
.set input{width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--fieldbg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.alarm{position:fixed;inset:0;z-index:30;display:none;place-content:center;text-align:center;color:#10162b}
.alarm.on{display:grid;animation:aflash .6s steps(1) infinite}
@keyframes aflash{0%{background:#ff6b5e}50%{background:#ffd36b}}
.ab{animation:shake .35s linear infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-12px,8px) rotate(-2deg)}40%{transform:translate(10px,-9px) rotate(2deg)}60%{transform:translate(-9px,-7px) rotate(-1deg)}80%{transform:translate(12px,7px) rotate(1.5deg)}100%{transform:translate(0,0) rotate(0)}}
.ai{font-size:clamp(90px,24vw,200px);line-height:1}
.alarm h2{margin:6px 0;font-size:clamp(34px,8vw,72px)}
.alarm p{margin:0 0 22px;font-size:20px;font-weight:600}
.alarm button{font:inherit;font-weight:700;font-size:20px;background:#10162b;color:#fff;border:0;border-radius:14px;padding:14px 44px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:9;display:none;place-content:center;text-align:center;background:rgba(5,8,18,.88);color:#eef1f8}
.ov.on{display:grid}
.ov b{font-size:clamp(120px,32vw,300px);line-height:1;color:var(--gold);animation:pop .8s ease-out}
.ov p{margin:6px 0 0;font-size:22px;color:var(--mute)}
@keyframes pop{0%{transform:scale(2.2);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.2}}
.brk .arc{stroke:#5fd39a}
.brk .clock{color:#5fd39a;text-shadow:0 0 28px rgba(95,211,154,.5)}
.quote,header,#pcard,#ccard,#swcard{transition:filter .6s}
body.fm .quote,body.fm header,body.fm #pcard,body.fm #ccard,body.fm #swcard{filter:blur(10px) brightness(.55);pointer-events:none}
body.fm #tcard{position:relative;z-index:2;box-shadow:0 0 0 1px var(--gold),0 30px 80px rgba(0,0,0,.6)}
.chip{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip.on{background:var(--gold);color:var(--onacc);border-color:var(--gold);font-weight:600}
.chip.del{border-color:rgba(255,107,94,.55)}
.chip.del.confirm{background:var(--red);color:#10162b;border-color:var(--red);font-weight:600}
.subsel,.opts,.addsub{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}

.subs{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.subs h3{margin:0 0 10px;font-size:15px;color:var(--mute);font-weight:600}
.sr{display:grid;grid-template-columns:150px 1fr 95px;gap:10px;align-items:center;margin:8px 0;font-size:14px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
  var KEY="focus-desk-v2";
  var DEF_SUBS=["Physics","Chemistry","Biology","English","Bangladesh Affairs"];
  var S={name:"",target:7,mins:25,exam:"",theme:3,hist:{},sh:{},subs:DEF_SUBS.slice(),sub:"",wt:49,focus:0,auto:0,ses:{d:"",n:0},bd:{},bdi:0,snd:1};
  /* The earlier Bangla version saved these default subject names; they are renamed so old progress carries over. */
  var MAP={"পদার্থ":"Physics","রসায়ন":"Chemistry","জীববিজ্ঞান":"Biology","ইংরেজি":"English","বাংলাদেশ বিষয়াবলি":"Bangladesh Affairs"};
  function mapName(n){return Object.prototype.hasOwnProperty.call(MAP,n)?MAP[n]:n;}
  var ready=false,loadNote="";
  function isObj(x){return !!x&&typeof x==="object"&&!Array.isArray(x);}
  var DRE=/^\d{4}-\d{2}-\d{2}$/;
  /* Only White (3) and Black (4) remain. Older choices map over: the dark Blue becomes Black, the light themes become White. */
  function normTheme(v){v=+v;if(v===3||v===4)return v;if(v===1)return 4;if(v===0||v===2)return 3;return NaN;}
  function numIn(v,lo,hi,d){v=+v;return isFinite(v)&&v>=lo&&v<=hi?v:d;}
  function cleanSecs(o){var r={};if(!isObj(o))return r;for(var k in o){if(!DRE.test(k))continue;var v=+o[k];if(isFinite(v)&&v>0)r[k]=Math.min(v,86400);}return r;}
  function cleanSh(o){var r={};if(!isObj(o))return r;for(var d in o){if(!DRE.test(d)||!isObj(o[d]))continue;var rec={};for(var s in o[d]){var v=+o[d][s];if(s!=="__proto__"&&isFinite(v)&&v>0)rec[s]=Math.min(v,86400);}r[d]=rec;}return r;}
  function cleanSubs(a){var r=[];if(!Array.isArray(a))return r;a.forEach(function(s){if(typeof s!=="string")return;s=s.trim().slice(0,20);if(s&&s!=="__proto__"&&r.indexOf(s)<0&&r.length<100)r.push(s);});return r;}
  /* Copies only known fields, and only when they have a valid shape. Anything else in storage is ignored. */
  function applyStored(o){
    if(!isObj(o))return;
    if(typeof o.name==="string")S.name=o.name.trim().slice(0,24);
    if(o.target!==undefined)S.target=numIn(o.target,1,16,S.target);
    if(o.wt!==undefined)S.wt=numIn(o.wt,1,112,S.wt);
    if(o.mins!==undefined)S.mins=Math.round(numIn(o.mins,1,180,S.mins));
    if(typeof o.exam==="string"&&(o.exam===""||DRE.test(o.exam)))S.exam=o.exam;
    if(o.theme!==undefined){var nt=normTheme(o.theme);if(nt===nt)S.theme=nt;}
    ["focus","auto","snd","notifAsked","mig","mig2","bdi"].forEach(function(k){if(o[k]!==undefined)S[k]=o[k]?1:0;});
    if(o.notif===0||o.notif===1)S.notif=o.notif;
    if(o.view===7||o.view===30)S.view=o.view;
    if(isObj(o.hist))S.hist=cleanSecs(o.hist);
    if(isObj(o.sh))S.sh=cleanSh(o.sh);
    var sb=cleanSubs(o.subs);if(sb.length)S.subs=sb;
    if(typeof o.sub==="string")S.sub=o.sub;
    if(isObj(o.bd)){var b={};for(var k in o.bd)if(/^\d{1,4}$/.test(k)&&o.bd[k])b[k]=1;S.bd=b;}
    if(isObj(o.ses)&&typeof o.ses.d==="string"&&isFinite(+o.ses.n)&&+o.ses.n>=0)S.ses={d:o.ses.d.slice(0,10),n:Math.floor(+o.ses.n)};
    if(isObj(o.ay)&&isFinite(+o.ay.i)&&isFinite(+o.ay.t))S.ay={i:Math.floor(+o.ay.i),t:+o.ay.t};
    if(isObj(o.sw))S.sw=o.sw;
    var u=o.run;
    if(isObj(u)&&(u.m==="focus"||u.m==="break")&&isFinite(+u.r)&&+u.r>0&&+u.r<=10800&&(+u.b===300||+u.b===900)&&isFinite(+u.t))
      S.run={m:u.m,r:+u.r,b:+u.b,s:typeof u.s==="string"?u.s:"",t:+u.t,on:u.on?1:0};
  }
  function load(){
    var raw=null,o=null,good=false;
    try{raw=localStorage.getItem(KEY);}catch(e){return;}
    if(raw){
      try{o=JSON.parse(raw);if(!isObj(o))throw 0;good=true;}
      catch(e){
        o=null;
        /* Unreadable data: keep a copy of it, and fall back to the last good copy instead of starting empty. */
        try{if(!localStorage.getItem(KEY+"-corrupt"))localStorage.setItem(KEY+"-corrupt",raw);}catch(e2){}
        try{var b=localStorage.getItem(KEY+"-bak");if(b){var ob=JSON.parse(b);if(isObj(ob)){o=ob;loadNote="Saved data could not be read. Your last good copy was restored.";}}}catch(e3){}
        if(!o)loadNote="Saved data could not be read, so the app started fresh. A copy of the old data was kept in this browser.";
      }
    }
    if(o)applyStored(o);
    if(good){try{localStorage.setItem(KEY+"-bak",raw);}catch(e){}}
  }
  function save(){
    try{if(ready)S.run=snap();}catch(e){}
    /* Never let a stale copy of the app (another tab) shrink the study history already stored. */
    try{
      var r=localStorage.getItem(KEY);
      if(r){var o=JSON.parse(r);if(isObj(o)){
        var h=cleanSecs(o.hist);for(var k in h)if((S.hist[k]||0)<h[k])S.hist[k]=h[k];
        var s=cleanSh(o.sh);for(var d in s){var rec=S.sh[d]||(S.sh[d]={});for(var j in s[d])if((rec[j]||0)<s[d][j])rec[j]=s[d][j];}
      }}
    }catch(e){}
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  }
  function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  var nf=function(n){return Number(n).toLocaleString("en-US");};
  var two=function(n){return (n<10?"0":"")+n;};
  var $=function(id){return document.getElementById(id);};
  var TC=2*Math.PI*148,PC=2*Math.PI*140,WC=2*Math.PI*50;
  $("tarc").style.strokeDasharray=TC;$("parc").style.strokeDasharray=PC;$("warc").style.strokeDasharray=WC;
  load();
  if(!S.mig){S.mig=1;try{var o1=JSON.parse(localStorage.getItem("study-screen-v1")||"null");
    if(o1&&o1.date&&o1.studied>0){var p=o1.date.split("-");var k=p[0]+"-"+String(p[1]).padStart(2,"0")+"-"+String(p[2]).padStart(2,"0");
      if((S.hist[k]||0)<o1.studied)S.hist[k]=o1.studied;}}catch(e){}save();}
  if(!Array.isArray(S.subs)||!S.subs.length)S.subs=DEF_SUBS.slice();
  if(!S.sw||typeof S.sw!=="object")S.sw={el:0,run:0,t:0};
  S.sw.el=Math.max(0,+S.sw.el||0);S.sw.run=S.sw.run?1:0;S.sw.t=+S.sw.t||0;S.sw.m=S.sw.m===1?1:0;S.sw.len=Math.round(numIn(S.sw.len,1,600,10));
  if(S.sw.run&&(!S.sw.t||S.sw.t>Date.now()))S.sw.t=Date.now();
  if(!S.mig2){S.mig2=1;
    var seen={},ns=[];S.subs.forEach(function(s){s=mapName(s);if(!seen[s]){seen[s]=1;ns.push(s);}});S.subs=ns;
    S.sub=mapName(S.sub);
    var nsh={};for(var dk0 in S.sh){var r0=S.sh[dk0],nr={};for(var k0 in r0){var nk=mapName(k0);nr[nk]=(nr[nk]||0)+r0[k0];}nsh[dk0]=nr;}
    S.sh=nsh;save();}
  if(!S.sub||S.subs.indexOf(S.sub)<0)S.sub=S.subs[0];
  var AYAHS=[
    ["সূরা আল-ইনশিরাহ ৯৪:৫–৬","নিশ্চয়ই কষ্টের সাথেই স্বস্তি আছে। নিশ্চয়ই কষ্টের সাথেই স্বস্তি আছে।"],
    ["সূরা আল-ইনশিরাহ ৯৪:৭–৮","অতএব যখনই অবসর পাও, পরিশ্রমে লেগে যাও; আর তোমার রবের প্রতিই মনোযোগী হও।"],
    ["সূরা আল-বাকারা ২:২৮৬","আল্লাহ কারও ওপর তার সাধ্যের অতিরিক্ত বোঝা চাপান না।"],
    ["সূরা আর-রাদ ১৩:১১","নিশ্চয়ই আল্লাহ কোনো জাতির অবস্থা পরিবর্তন করেন না, যতক্ষণ না তারা নিজেরা নিজেদের অবস্থা পরিবর্তন করে।"],
    ["সূরা আত-তালাক ৬৫:২–৩","যে আল্লাহকে ভয় করে, আল্লাহ তার জন্য সংকট থেকে উত্তরণের পথ বের করে দেন এবং তাকে এমন উৎস থেকে রিজিক দেন, যা সে কল্পনাও করেনি। যে আল্লাহর ওপর ভরসা করে, তার জন্য তিনিই যথেষ্ট।"],
    ["সূরা আলে ইমরান ৩:১৩৯","তোমরা হীনবল হয়ো না এবং দুঃখ কোরো না; যদি তোমরা মুমিন হও, তবে তোমরাই বিজয়ী হবে।"],
    ["সূরা আলে ইমরান ৩:১৫৯","অতঃপর যখন তুমি সংকল্প করবে, তখন আল্লাহর ওপর ভরসা করো। নিশ্চয়ই আল্লাহ ভরসাকারীদের ভালোবাসেন।"],
    ["সূরা আন-নাজম ৫৩:৩৯","আর মানুষ তা-ই পায়, যার জন্য সে চেষ্টা করে।"],
    ["সূরা ত্বা-হা ২০:১১৪","আর বলো, হে আমার রব, আমার জ্ঞান বৃদ্ধি করে দিন।"],
    ["সূরা আয-যুমার ৩৯:৯","বলো, যারা জানে এবং যারা জানে না, তারা কি সমান হতে পারে?"],
    ["সূরা আল-মুজাদালা ৫৮:১১","তোমাদের মধ্যে যারা ঈমান এনেছে এবং যাদের জ্ঞান দেওয়া হয়েছে, আল্লাহ তাদের মর্যাদা উঁচু করবেন।"],
    ["সূরা আল-আলাক ৯৬:১","পড়ো তোমার রবের নামে, যিনি সৃষ্টি করেছেন।"],
    ["সূরা আল-বাকারা ২:১৫৩","হে ঈমানদাররা, ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো। নিশ্চয়ই আল্লাহ ধৈর্যশীলদের সাথে আছেন।"],

  window.addEventListener("pagehide",function(){if(running)loop();save();});
  document.addEventListener("visibilitychange",function(){if(running)loop();swDraw();if(document.hidden)save();});
  rt();setInterval(rt,1000);
  showAy(false);
  subSel();week();setMins(S.mins);
  restoreRun();render();
})();
</script>
