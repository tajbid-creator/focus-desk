name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: Add alarm and notification permissions
        run: |
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf-8").read()
          add=""
          for n in ["POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","USE_EXACT_ALARM","VIBRATE","WAKE_LOCK","RECEIVE_BOOT_COMPLETED"]:
              if "android.permission."+n not in s:
                  add+='    <uses-permission android:name="android.permission.%s" />\n'%n
          s=s.replace("<application",add+"    <application",1)
          open(p,"w",encoding="utf-8").write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: focus-desk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
